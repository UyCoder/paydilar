<script src="{{ '/js/script.js' | relative_url }}"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function() {
    function initMermaid() {
        var codeBlocks = document.querySelectorAll(
            'div.language-mermaid, pre.language-mermaid, code.language-mermaid, [class*="language-mermaid"]'
        );
        if (codeBlocks.length === 0) return;

        var containers = [];
        codeBlocks.forEach(function(el) {
            var target = el.closest('.highlighter-rouge') || el.closest('pre') || el;
            if (containers.indexOf(target) === -1) {
                containers.push(target);
            }
        });

        if (typeof mermaid === 'undefined') return;

        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
            fontFamily: "'Alkatip', 'UKIJ Tuz', 'Microsoft Uighur', Arial, sans-serif"
        });

        var nodesToRender = [];
        containers.forEach(function(container) {
            var rawCode = container.textContent.trim();
            var wrapper = document.createElement('div');
            wrapper.className = 'mermaid-block no-tts';

            var pre = document.createElement('pre');
            pre.className = 'mermaid';
            pre.textContent = rawCode;

            wrapper.appendChild(pre);
            container.parentNode.replaceChild(wrapper, container);
            nodesToRender.push(pre);
        });

        if (nodesToRender.length > 0) {
            mermaid.run({
                nodes: nodesToRender
            }).catch(function(err) {
                console.warn('Mermaid render warning:', err);
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
        initMermaid();
    }
})();
</script>
