<style>
  /* ── Fonts ── */
  @font-face {
    font-family: 'Alkatip';
    src: url('{{ "/fonts/ALKATIP-TOR.woff2" | relative_url }}') format('woff2'),
         url('{{ "/fonts/ALKATIP-TOR.woff" | relative_url }}') format('woff');
    font-display: swap;
  }

  /* ── Design tokens (nav subset) ── */
  :root {
    --primary:       #0277bd;
    --primary-dark:  #01579b;
    --primary-lite:  #e1f5fe;
    --primary-mid:   #b3e5fc;
    --bg:            #f2f5f9;
    --bg-2:          #e8ecf2;
    --card:          #ffffff;
    --border:        #e0e6ed;
    --text-1:        #1a2235;
    --text-2:        #4a5568;
    --shadow-xs:     0 1px 3px rgba(0,0,0,0.07);
    --shadow-sm:     0 2px 10px rgba(0,0,0,0.08);
    --radius-sm:     7px;
    --nav-h:         62px;
    --ease:          all 0.22s ease;
    --radius:        12px;
    --text-3:        #8a96a8;
    --shadow-md:     0 6px 24px rgba(0,0,0,0.10);
  }

  /* ── Global base (applied when this nav is included in default.html) ── */
  body {
    font-family: 'Alkatip', 'UKIJ Tuz', 'Microsoft Uighur', 'Noto Naskh Arabic', Arial, sans-serif;
    direction: rtl;
    background: var(--bg);
    color: var(--text-1);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); text-decoration: none; transition: var(--ease); }
  a:hover { color: var(--primary-dark); }
  .container {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ── Sticky nav ── */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 999;
    background: rgba(255,255,255,0.97);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-xs);
    height: var(--nav-h);
  }
  /* All nav rules use .site-nav prefix to override Bulma with higher specificity */
  .site-nav .nav-inner {
    display: flex !important;
    align-items: center !important;
    height: 100% !important;
    gap: 16px !important;
    max-width: 1160px !important;
    margin: 0 auto !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
  }
  .site-nav .nav-brand {
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
    font-weight: 700 !important;
    font-size: 1.08rem !important;
    color: var(--text-1) !important;
    white-space: nowrap !important;
    flex-shrink: 0 !important;
    text-decoration: none !important;
  }
  .site-nav .nav-brand .site-name { color: var(--primary) !important; }
  .site-nav .nav-links {
    display: flex !important;
    align-items: center !important;
    gap: 2px !important;
    flex: 1 !important;
    justify-content: center !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .site-nav .nav-links a {
    padding: 5px 13px !important;
    border-radius: var(--radius-sm) !important;
    font-size: 0.9rem !important;
    color: var(--text-2) !important;
    white-space: nowrap !important;
    transition: var(--ease) !important;
    text-decoration: none !important;
    background: transparent !important;
    border: none !important;
    display: inline-block !important;
    line-height: normal !important;
  }
  .site-nav .nav-links a:hover { background: var(--primary-lite) !important; color: var(--primary) !important; }
  .site-nav .nav-links a.active { background: var(--primary) !important; color: #fff !important; }
  .site-nav .nav-burger {
    display: none !important;
    background: none !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius-sm) !important;
    padding: 6px 10px !important;
    cursor: pointer !important;
    color: var(--text-2) !important;
    font-size: 1rem !important;
    margin-inline-start: auto !important;
  }
  .site-nav .nav-burger:hover { background: var(--bg-2) !important; }
  .mobile-menu {
    display: none;
    flex-direction: column;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px 12px;
    gap: 4px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: var(--nav-h);
    z-index: 998;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    display: block !important;
    padding: 9px 14px !important;
    border-radius: var(--radius-sm) !important;
    color: var(--text-2) !important;
    font-size: 0.95rem !important;
    text-decoration: none !important;
  }
  .mobile-menu a:hover { background: var(--primary-lite) !important; color: var(--primary) !important; }
  .hikmet-bar {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: rgba(255,255,255,0.92);
    font-size: 0.82rem;
    padding: 7px 0;
    text-align: center;
    letter-spacing: 0.02em;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .hikmet-bar::before { content: "💡 "; opacity: 0.8; }

  /* Search bar */
  .nav-search {
    position: relative;
    flex-shrink: 0;
    margin-inline-start: auto;
  }
  .nav-search-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    cursor: pointer;
    color: var(--text-2);
    font-size: 0.9rem;
    font-family: 'Alkatip', 'UKIJ Tuz', 'Microsoft Uighur', 'Noto Naskh Arabic', Arial, sans-serif;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: var(--ease);
  }
  .nav-search-btn:hover { background: var(--bg-2); border-color: var(--primary-mid); }
  .search-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1100;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
  }
  .search-overlay.open { display: flex; }
  .search-box {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 640px;
    margin: 0 20px;
    overflow: hidden;
  }
  .search-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .search-input-row i { color: var(--primary); font-size: 1rem; }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 1rem;
    font-family: 'Alkatip', 'UKIJ Tuz', 'Microsoft Uighur', 'Noto Naskh Arabic', Arial, sans-serif;
    direction: rtl;
    background: transparent;
    color: var(--text-1);
  }
  .search-close-btn {
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    color: var(--text-3);
    padding: 2px 6px;
  }
  .search-results {
    max-height: 420px;
    overflow-y: auto;
    padding: 8px 0;
  }
  .search-result-item {
    display: flex;
    flex-direction: column;
    padding: 11px 18px;
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: var(--ease);
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--bg); }
  .sr-title { font-size: 0.95rem; font-weight: 600; color: var(--text-1); }
  .sr-meta  { font-size: 0.78rem; color: var(--text-3); margin-top: 2px; }
  .search-empty { padding: 24px 18px; text-align: center; color: var(--text-3); font-size: 0.9rem; }

  @media (max-width: 640px) {
    .site-nav .nav-links { display: none !important; }
    .site-nav .nav-burger { display: flex !important; align-items: center !important; }
  }
</style>

<!-- Search index (Liquid generates JS array of all posts) -->
<script>
var SEARCH_INDEX = [
  {% for post in site.posts %}
  {
    t: {{ post.title | jsonify }},
    u: "{{ post.url | relative_url }}",
    d: "{{ post.date | date: '%Y-%m-%d' }}",
    e: {{ post.content | strip_html | strip_newlines | truncate: 400 | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
</script>

<!-- ================================================================
     MAIN NAV
================================================================ -->
<nav class="site-nav" role="navigation" aria-label="ئاساسىي تىزملىك">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      <span class="site-name">{{ site.title }}</span>
    </a>

    <div class="nav-links" id="navLinks">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>باش بەت</a>
      {% for item in site.data.nav.items %}
      <a href="{{ item.link | relative_url }}"{% if page.url contains item.link %} class="active"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </div>

    <!-- Search button — far left in RTL -->
    <div class="nav-search">
      <button type="button" class="nav-search-btn" id="searchOpenBtn" aria-label="ئىزدەش">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>ئىزدەش</span>
      </button>
    </div>

    <button type="button" class="nav-burger" id="burgerBtn" aria-label="تىزملىك" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</nav>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)_closeSearch()">
  <div class="search-box">
    <div class="search-input-row">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" class="search-input" id="searchInput"
             placeholder="ماقالە ئىزدەش…" autocomplete="off" dir="rtl">
      <button type="button" class="search-close-btn" onclick="_closeSearch()">✕</button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-empty">ئىزدىمەكچى بولغان ماقالىنى كىرگۈزۈڭ</div>
    </div>
  </div>
</div>

<div class="mobile-menu" id="mobileMenu">
  <a href="{{ '/' | relative_url }}">🏠 باش بەت</a>
  {% for item in site.data.nav.items %}
  <a href="{{ item.link | relative_url }}">{{ item.name }}</a>
  {% endfor %}
</div>

<div class="hikmet-bar" id="hikmetBar">يۈكلىنىۋاتىدۇ...</div>

<script>
(function() {
  var burger = document.getElementById('burgerBtn');
  var menu   = document.getElementById('mobileMenu');
  if (burger && menu) {
    burger.addEventListener('click', function() {
      var open = menu.classList.toggle('open');
      burger.setAttribute('aria-expanded', open);
      burger.querySelector('i').className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    });
  }

  var hikmetEl = document.getElementById('hikmetBar');
  if (hikmetEl) {
    fetch('https://raw.githubusercontent.com/UyCoder/paydilar/master/hikmetler/hikmetler.txt')
      .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function(txt) {
        var lines = txt.split(/[\n.]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 8; });
        if (lines.length) {
          hikmetEl.textContent = lines[Math.floor(Math.random() * lines.length)];
        }
      })
      .catch(function() { hikmetEl.textContent = 'پايدىلىق بىلىملەر ۋە پىكىرلەر'; });
  }

  /* ── Search ── */
  var searchOpen  = document.getElementById('searchOpenBtn');
  var overlay     = document.getElementById('searchOverlay');
  var searchInput = document.getElementById('searchInput');
  var results     = document.getElementById('searchResults');

  if (searchOpen) {
    searchOpen.addEventListener('click', function() {
      overlay.classList.add('open');
      setTimeout(function(){ searchInput && searchInput.focus(); }, 80);
    });
  }

  window._closeSearch = function() {
    if (overlay) overlay.classList.remove('open');
    if (searchInput) searchInput.value = '';
    if (results) results.innerHTML = '<div class="search-empty">ئىزدىمەكچى بولغان ماقالىنى كىرگۈزۈڭ</div>';
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window._closeSearch();
  });

  if (searchInput) {
    searchInput.addEventListener('input', function() {
      var q = this.value.trim();
      if (!q || q.length < 1) {
        results.innerHTML = '<div class="search-empty">ئىزدىمەكچى بولغان ماقالىنى كىرگۈزۈڭ</div>';
        return;
      }
      var ql = q.toLowerCase();
      var matched = (typeof SEARCH_INDEX !== 'undefined' ? SEARCH_INDEX : []).filter(function(p) {
        return (p.t && p.t.indexOf(q) >= 0) ||
               (p.e && p.e.indexOf(q) >= 0) ||
               (p.t && p.t.toLowerCase().indexOf(ql) >= 0);
      }).slice(0, 12);
      if (!matched.length) {
        results.innerHTML = '<div class="search-empty">« ' + q + ' » بويىچە نەتىجە تېپىلمىدى</div>';
        return;
      }
      results.innerHTML = matched.map(function(p) {
        return '<a class="search-result-item" href="' + p.u + '?hl=' + encodeURIComponent(q) + '">' +
          '<span class="sr-title">' + p.t + '</span>' +
          '<span class="sr-meta">' + p.d + (p.e ? ' · ' + p.e.slice(0, 80) : '') + '</span>' +
          '</a>';
      }).join('');
    });
  }
})();
</script>
