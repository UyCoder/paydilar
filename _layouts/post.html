---
layout: default
---

<style>
  .post-hero-img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    display: block;
    border-radius: 0 0 12px 12px;
    margin-bottom: 0;
  }
  .post-wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 20px 60px;
    direction: rtl;
  }
  .post-header {
    margin-bottom: 28px;
    text-align: right;
  }
  .post-meta-line {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .post-cat-pill {
    display: inline-block;
    background: #e1f5fe;
    color: #0277bd;
    font-size: 0.78rem;
    padding: 3px 12px;
    border-radius: 20px;
    font-weight: 600;
    border: 1px solid #b3e5fc;
  }
  .post-date-txt {
    font-size: 0.82rem;
    color: #8a96a8;
  }
  .post-main-title {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.4;
    color: #1a2235;
    margin-bottom: 0;
    text-align: center;
  }
  .post-content-body {
    font-family: 'Alkatip', 'UKIJ Tuz', 'Microsoft Uighur',
                 'Noto Naskh Arabic', Arial, sans-serif;
    font-size: 1.08rem;
    line-height: 1.9;
    color: #2d3748;
  }
  /* Paragraphs: justified both sides + 2-em first-line indent */
  .post-content-body p {
    text-align: justify;
    text-indent: 2em;
    margin-bottom: 18px;
  }
  /* Headings inside the article: centered */
  .post-content-body h1,
  .post-content-body h2,
  .post-content-body h3,
  .post-content-body h4 {
    color: #1a2235;
    margin: 32px 0 12px;
    font-weight: 700;
    text-align: center;
    text-indent: 0;
  }
  .post-content-body h2 { font-size: 1.35rem; border-bottom: 2px solid #e0e6ed; padding-bottom: 6px; }
  .post-content-body p  { margin-bottom: 18px; }
  .post-content-body a  { color: #0277bd; text-decoration: underline; }
  .post-content-body img {
    max-width: 100%; height: auto;
    border-radius: 10px;
    margin: 20px auto;
    display: block;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
  }
  .post-content-body blockquote {
    border-right: 4px solid #0277bd;
    background: #f4f7fb;
    margin: 20px 0;
    padding: 14px 20px;
    border-radius: 6px;
    color: #4a5568;
    font-style: italic;
    text-align: justify;
  }
  .post-content-body blockquote p {
    text-indent: 0;
  }
  .post-content-body pre,
  .post-content-body code {
    direction: ltr;
    text-align: left;
    font-family: 'Courier New', monospace;
  }
  .post-content-body pre {
    background: #1a2235;
    color: #e2e8f0;
    padding: 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 20px 0;
  }
  .post-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #0277bd;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 24px;
    padding: 6px 14px;
    background: #e1f5fe;
    border-radius: 7px;
    transition: all 0.2s;
  }
  .post-back:hover { background: #0277bd; color: #fff; }
</style>

{% if page.image %}
<img src="{{ page.image }}" alt="{{ page.title }}" class="post-hero-img">
{% endif %}

<div class="post-wrap">
  <a href="{{ '/' | relative_url }}" class="post-back">
    &#8594; باش بەتكە
  </a>

  <header class="post-header">
    <div class="post-meta-line">
      {% if page.categories.size > 0 %}
      <span class="post-cat-pill">{{ page.categories | first | replace: "_", " " }}</span>
      {% endif %}
      <span class="post-date-txt">{{ page.date | date: "%Y · %m · %d" }}</span>
    </div>
    <h1 class="post-main-title">{{ page.title }}</h1>
  </header>

  <div class="post-content-body">
    {{ content }}
  </div>
</div>
